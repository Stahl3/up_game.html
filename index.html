<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upper Peninsula Hunt & Fish - Math Game</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>🎣 Upper Peninsula Hunt & Fish 🦌</h1>
            <p>Educational Math Game for Chromebooks</p>
        </header>

        <main>
            <!-- TITLE SCREEN -->
            <div id="titleScreen" class="screen active">
                <h2>Welcome to the UP Game!</h2>
                <p>Solve math problems to catch fish and hunt animals in Michigan's Upper Peninsula!</p>
                
                <div class="input-group">
                    <label for="playerName">Enter Your Name:</label>
                    <input type="text" id="playerName" placeholder="Your name here..." maxlength="30">
                </div>

                <div class="button-group">
                    <button class="btn-fishing" onclick="startGame('fishing')">🎣 Go Fishing</button>
                    <button class="btn-hunting" onclick="startGame('hunting')">🦌 Go Hunting</button>
                    <button class="btn-primary" onclick="showLeaderboard()">📊 Leaderboard</button>
                </div>
            </div>

            <!-- GAME SCREEN -->
            <div id="gameScreen" class="screen">
                <div class="game-header">
                    <div class="player-info">Player: <span id="playerDisplay"></span></div>
                    <div class="score-display">
                        <div class="score-item">Score: <span id="score">0</span></div>
                        <div class="score-item">Caught: <span id="caught">0</span></div>
                    </div>
                </div>

                <div id="gameTitle"></div>
                <div id="instructionsText"></div>

                <canvas id="gameCanvas" width="800" height="500"></canvas>

                <div class="question-panel hidden" id="questionPanel">
                    <div id="questionText"></div>
                    <div class="answer-options">
                        <button class="answer-btn" onclick="answerQuestion(0)"></button>
                        <button class="answer-btn" onclick="answerQuestion(1)"></button>
                        <button class="answer-btn" onclick="answerQuestion(2)"></button>
                        <button class="answer-btn" onclick="answerQuestion(3)"></button>
                    </div>
                    <div id="answerFeedback"></div>
                </div>

                <div style="text-align: center; margin-top: 20px;">
                    <button class="btn-secondary" onclick="endGame()">← Back to Title</button>
                </div>
            </div>

            <!-- LEADERBOARD SCREEN -->
            <div id="leaderboardScreen" class="screen">
                <h2 style="color: #667eea; text-align: center; margin-bottom: 30px;">🏆 Leaderboard</h2>
                
                <div class="leaderboard-tabs">
                    <button class="tab-btn active" onclick="showLeaderboardTab('fishing')">🎣 Fishing</button>
                    <button class="tab-btn" onclick="showLeaderboardTab('hunting')">🦌 Hunting</button>
                </div>

                <table class="leaderboard-table">
                    <thead>
                        <tr>
                            <th>Rank</th>
                            <th>Player Name</th>
                            <th>Score</th>
                            <th>Caught</th>
                        </tr>
                    </thead>
                    <tbody id="leaderboardBody">
                        <tr><td colspan="4" style="text-align: center; padding: 30px;">No scores yet.</td></tr>
                    </tbody>
                </table>

                <div style="text-align: center;">
                    <button class="btn-primary" onclick="backToTitle()">← Back to Title</button>
                </div>
            </div>
        </main>
    </div>

    <script src="game.js"></script>
</body>
</html>
